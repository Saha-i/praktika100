<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление товара</title>
</head>
<body>

<h2>Добавление нового товара</h2>

<form th:action="@{/products/add}" th:object="${product}" method="post">
    <div>
        <label for="name">Название товара:</label>
        <input type="text" id="name" th:field="*{name}"   required />
    </div>

    <div>
        <label for="price">Цена:</label>
        <input type="number" id="price" step="0.01" th:field="*{price}" required />

    </div>

    <div >
        <label for="description">Описание:</label>
        <textarea id="description" rows="4" th:field="*{description}"></textarea>
    </div>

    <button type="submit">Сохранить</button>
    <a href="/products">Назад к списку</a>
</form>

</body>
</html>
